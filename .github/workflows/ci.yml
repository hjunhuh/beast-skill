name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  beast-remotion:
    name: beast-remotion template
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/beast-remotion/template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/beast-remotion/template/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Demo plan passes the retention checker
        run: npm run check:demo
